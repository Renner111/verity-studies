<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#e8edff" />
  <title>Verity Studies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=2" />
</head>
<body>
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Verity Studies home"><span class="brand-mark">✓</span><span>Verity Studies</span></a>
      <nav class="mode-switch" aria-label="Search mode">
        <button class="mode-button active" data-mode="text" type="button">Learn</button>
        <button class="mode-button" data-mode="images" type="button">Images</button>
      </nav>
      <button class="icon-button" id="newChat" type="button" aria-label="Start new topic">＋</button>
    </header>
    <section class="welcome" id="welcome">
      <p class="eyebrow">EXPLORE WITH CLARITY</p>
      <h1>What do you want to<br />understand?</h1>
      <form class="search-box" id="searchForm">
        <input id="searchInput" autocomplete="off" placeholder="Ask about any topic..." aria-label="Topic to learn about" />
        <button type="submit" aria-label="Search">→</button>
      </form>
      <div class="suggestions">
        <a role="button" data-query="How black holes work" href="?topic=How%20black%20holes%20work" style="display:inline-block;padding:9px 13px;border:1px solid rgba(72,75,127,.09);border-radius:999px;color:#707289;background:rgba(255,255,255,.48);font-size:13px;text-decoration:none">Black holes</a>
        <a role="button" data-query="The history of ancient Rome" href="?topic=The%20history%20of%20ancient%20Rome" style="display:inline-block;padding:9px 13px;border:1px solid rgba(72,75,127,.09);border-radius:999px;color:#707289;background:rgba(255,255,255,.48);font-size:13px;text-decoration:none">Ancient Rome</a>
        <a role="button" data-query="How photosynthesis works" href="?topic=How%20photosynthesis%20works" style="display:inline-block;padding:9px 13px;border:1px solid rgba(72,75,127,.09);border-radius:999px;color:#707289;background:rgba(255,255,255,.48);font-size:13px;text-decoration:none">Photosynthesis</a>
        <a role="button" data-query="The Renaissance" href="?topic=The%20Renaissance" style="display:inline-block;padding:9px 13px;border:1px solid rgba(72,75,127,.09);border-radius:999px;color:#707289;background:rgba(255,255,255,.48);font-size:13px;text-decoration:none">The Renaissance</a>
      </div>
    </section>
    <section class="study" id="study" hidden>
      <div class="study-header"><div><p class="topic-kicker">CURRENT TOPIC</p><h2 id="topicTitle">Topic</h2></div><button class="share-button" id="shareButton" type="button">Share</button></div>
      <nav class="tabs" aria-label="Topic sections">
        <button class="tab active" data-tab="overview" type="button">Overview</button>
        <button class="tab" data-tab="details" type="button">Deep dive</button>
        <button class="tab" data-tab="gallery" type="button">Gallery <span id="imageCount">0</span></button>
        <button class="tab" data-tab="sources" type="button">Sources</button>
      </nav>
      <div class="tab-panels">
        <article class="panel active" id="overviewPanel">
          <div class="summary-grid"><div class="main-summary"><p class="status-line"><span class="status-dot"></span><span id="statusText">Searching sources</span></p><div id="summaryText" class="summary-text"></div><div class="key-facts" id="keyFacts"></div></div><div class="featured-image" id="featuredImage"><div class="image-placeholder">Matching image</div></div></div>
        </article>
        <article class="panel" id="detailsPanel"><div class="details-layout"><div><p class="section-label">EXPLORE FURTHER</p><h3 id="deepDiveTitle">About this topic</h3><div id="deepDiveText" class="article-copy"></div></div><aside class="questions" id="quickQuestions"><p class="section-label">FOLLOW-UPS</p></aside></div></article>
        <article class="panel" id="galleryPanel"><div class="gallery-grid" id="galleryGrid"></div></article>
        <article class="panel" id="sourcesPanel"><div class="sources-list" id="sourcesList"></div></article>
      </div>
      <section class="chat" aria-label="Conversation"><div class="messages" id="messages"></div><form class="chat-input" id="chatForm"><input id="chatInput" autocomplete="off" placeholder="Ask a follow-up question..." aria-label="Follow-up question" /><button type="submit" aria-label="Send follow-up">→</button></form></section>
    </section>
  </main>
  <div class="toast" id="toast" role="status">Link copied</div>
  <script src="app.js?v=3"></script>
</body>
</html>
